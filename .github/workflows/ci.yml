name: CI

# Roda em todo PR e em todo push para as branches de integração.
# O objetivo é simples: ninguém mergeia com teste quebrado ou erro de tipo.
on:
  push:
    branches: [desenvolvimento, main]
  pull_request:
    branches: [desenvolvimento, main]

# Um push novo no mesmo PR cancela a execução anterior, que já ficou obsoleta.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Descobre o que o PR mexeu. O filtro fica aqui, e não em `on.paths`, porque
  # um workflow que nem dispara deixa o check obrigatório da regra de PR
  # pendente para sempre; já um job pulado por `if` conta como aprovado.
  mudancas:
    name: Detectar mudanças
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      frontend: ${{ steps.filtro.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            frontend:
              - 'frontend/**'
              - '.github/workflows/**'

  backend:
    name: Backend — tipos e testes
    needs: mudancas
    if: needs.mudancas.outputs.backend == 'true'
    runs-on: ubuntu-latest

    # As regras críticas do ViaCar (a trigger da RN-01, o índice parcial da
    # RN-02) vivem DENTRO do banco, então a suíte roda contra um Postgres de
    # verdade — mock não provaria nada sobre elas.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viacar
          POSTGRES_PASSWORD: viacar
          POSTGRES_DB: viacar
        # 5433 no host porque é a porta que o .env.test versionado espera.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U viacar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # O postinstall do projeto gera o Prisma Client. Sem ele nada compila.
      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Compilar
        run: npm run build

      # O global-setup cria o banco viacar_test e aplica as migrations.
      - name: Rodar a suíte
        run: npm test

  frontend:
    name: Frontend — lint e build
    needs: mudancas
    if: needs.mudancas.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      # Ainda não bloqueia: o App.tsx tem 5 erros de lint herdados. Quando forem
      # corrigidos, remover o continue-on-error para o lint passar a reprovar PR.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # `tsc -b && vite build` — pega erro de tipo que o dev server deixa passar.
      - name: Compilar
        run: npm run build
